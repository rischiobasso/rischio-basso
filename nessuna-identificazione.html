<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NESSUNA IDENTIFICAZIONE // RISCHIO BASSO</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#050505;
color:#d8d8d8;
font-family:"Courier New",monospace;
}

body:before{
content:"";
position:fixed;
inset:0;
background:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px);
background-size:100% 4px;
pointer-events:none;
}

header{
padding:28px 44px;
border-bottom:1px solid #222;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:31px;
line-height:.95;
letter-spacing:4px;
font-weight:bold;
}

.back{
border:1px solid #333;
padding:12px 18px;
background:#080808;
color:#d8d8d8;
text-decoration:none;
}

main{
padding:42px 54px 70px;
max-width:1200px;
margin:auto;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:38px;
}

.card{
border:1px solid #333;
background:#080808;
padding:22px;
}

.card img,
.card video{
width:100%;
display:block;
}

.label{
color:#777;
font-size:12px;
margin-bottom:14px;
}

.text{
line-height:1.8;
color:#bfbfbf;
}

footer{
border-top:1px solid #222;
padding:28px 54px;
font-size:12px;
color:#777;
}

@media(max-width:850px){
.grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
<div class="logo">RISCHIO<br>BASSO</div>
<a class="back" href="index.html">← ARCHIVIO</a>
</header>

<main>

<div class="grid">

<div class="card">
<div class="label">FRAME ACQUISITO</div>

<img src="nessuna-identificazione.jpeg">

</div>

<div class="card text">

<div class="label">NOTA ARCHIVIO</div>

Il volto non risulta identificabile.

Il soggetto appare coperto e privo di elementi utili al riconoscimento.

La traccia resta aperta.

</div>

</div>

<div class="card" style="margin-top:38px">

<div class="label">VIDEO</div>

<video controls>
<source src="nessuna-identificazione.mp4" type="video/mp4">
</video>

</div>

</main>

<footer>
RISCHIO BASSO // identificazione assente
</footer>

</body>
</html>

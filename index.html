<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RISCHIO BASSO</title>

<style>

body{

margin:0;
padding:0;
background:#050505;
color:#e5e5e5;
font-family:monospace;
letter-spacing:1px;

}

main{

min-height:100vh;
padding:40px;

}

h1{

font-size:28px;
font-weight:400;
letter-spacing:6px;

}

a{

color:#e5e5e5;
text-decoration:none;

}

a:hover{

text-decoration:line-through;

}

/* IRIS SIGNAL */

#iris-signal{

position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#000;
opacity:0;
pointer-events:none;
z-index:99999;
overflow:hidden;
transition:opacity .15s ease;

}

#iris-signal.active{

opacity:.92;

}

#iris-image{

position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:70%;
max-width:900px;
opacity:.82;
filter:contrast(1.25) brightness(.95) blur(.4px) grayscale(.1);
animation:irisShake .12s infinite;

}

#iris-message{

position:absolute;
left:7%;
bottom:9%;
font-family:monospace;
font-size:14px;
letter-spacing:3px;
line-height:1.8;
color:white;
text-transform:uppercase;
opacity:.9;

}

.crt-lines{

position:absolute;
width:100%;
height:100%;
background:
repeating-linear-gradient(
0deg,
transparent 0px,
transparent 2px,
rgba(255,255,255,.03) 3px,
rgba(255,255,255,.02) 4px
);

}

.noise{

position:absolute;
width:100%;
height:100%;
background-image:
radial-gradient(
rgba(255,255,255,.04) 1px,
transparent 1px
);
background-size:4px 4px;
opacity:.25;

}

@keyframes irisShake{

0%{
transform:translate(-50%,-50%) translateX(0);
}

50%{
transform:translate(-50%,-50%) translateX(1px);
}

100%{
transform:translate(-50%,-50%) translateX(-1px);
}

}

</style>

</head>

<body>

<main>

<h1>RISCHIO BASSO</h1>

<p>ARCHIVIO ONLINE</p>
<p>NODO ATTIVO // BARI</p>
<p>WAIT FOR NEW SIGNAL</p>

<nav>
<p><a href="dossier.html">DOSSIER</a></p>
<p><a href="soggetto1.html">SOGGETTO 01</a></p>
<p><a href="coordinate.html">COORDINATE</a></p>
</nav>

</main>

<!-- IRIS SIGNAL -->

<div id="iris-signal">

<div class="crt-lines"></div>
<div class="noise"></div>

<img
src="iriscrt.jpeg"
id="iris-image"
alt="IRIS">

<div id="iris-message">
WAIT FOR NEW SIGNAL
</div>

</div>

<script>

const irisSignal =
document.getElementById("iris-signal");

const irisMessage =
document.getElementById("iris-message");

const messages = [

"WAIT FOR NEW SIGNAL",
"ARCHIVE ONLINE",
"NODE ACTIVE",
"SIGNAL LOST",
"TRANSMISSION DETECTED",
"INTERFERENCE FOUND",
"LOW RISK"

];

function triggerIris(){

let randomMessage =
messages[
Math.floor(
Math.random() * messages.length
)
];

irisMessage.innerHTML =
"HI EVERYBODY<br>" +
"THIS IS IRIS<br>" +
randomMessage;

irisSignal.classList.add("active");

setTimeout(()=>{

irisSignal.classList.remove("active");

},700);

let nextTime =
Math.random() * 25000 + 20000;

setTimeout(
triggerIris,
nextTime
);

}

setTimeout(
triggerIris,
30000
);

</script>

</body>

</html>
